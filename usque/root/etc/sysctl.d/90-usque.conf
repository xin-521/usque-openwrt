# /etc/sysctl.d/90-usque.conf
# 面向 arm64（ARMv8）OpenWrt 的 UDP/中断排队调优。
# 这里给的都是「上限」，不会立即占用内存，小内存路由器也安全。
# 立即生效： sysctl -p /etc/sysctl.d/90-usque.conf
#
# 1) quic-go 官方要求：UDP 收发缓冲不够会直接掉包并打印
#    "failed to sufficiently increase receive buffer size"。
#    quic-go 自己会把 socket 缓冲设到 7.5 MB，但内核 rmem_max 低于它时会被截断。
net.core.rmem_max = 7500000
net.core.wmem_max = 7500000
#
# 2) 高 pps 时软中断来不及处理，网卡先丢包（千兆小包/多客户端并发时明显）。
#    2000 个 skb 的排队上限，最坏约几 MB，arm64 路由（≥256MB）可放心用。
net.core.netdev_max_backlog = 2000

# ---- 以下按需手工启用（默认注释，避免小内存设备吃紧）--------------------------
# 3) 多客户端/NAT 会话多时，conntrack 表满会导致新连接被丢。
#    默认 16384；65536 约多占 15-20 MB 内核内存。
# net.netfilter.nf_conntrack_max = 65536
#
# 4) 高 pps 下每轮软中断多处理一些包，吞吐更稳，代价是延迟略升。
# net.core.netdev_budget = 600
